name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: pytest tests/ -v
      - name: Vérifier que le serveur démarre
        run: |
          timeout 10 python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          import server
          tools = server.mcp.list_tools_sync()
          assert len(tools) == 9, f"attendu 9 outils, obtenu {len(tools)}"
          print("Serveur MCP OK :", [t.name for t in tools])
          EOF
