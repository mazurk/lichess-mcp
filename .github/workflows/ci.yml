name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Installer Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: pytest tests/ -v
      - name: Tests web (Node)
        run: node --test tests/web/util.test.mjs
      - name: Vérifier que le serveur démarre
        run: |
          timeout 60 python - <<'EOF'
          import asyncio, sys
          sys.path.insert(0, ".")
          from fastmcp import Client
          import server

          async def main():
              async with Client(server.mcp) as c:
                  tools = await c.list_tools()
                  assert len(tools) == 13, f"attendu 13 outils, obtenu {len(tools)}"
                  print("Serveur MCP OK :", [t.name for t in tools])

          asyncio.run(main())
          EOF
