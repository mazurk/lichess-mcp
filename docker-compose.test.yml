# Override de TEST LOCAL : lance uniquement le conteneur app, sur le port
# 18000, avec un projet compose et un volume séparés (ne touche ni au port
# 80/443 ni aux données de prod). Usage :
#   printf 'LICHESS_MCP_AUTH_TOKEN=test-local\n' > /tmp/lichess-test.env
#   docker compose -p lichess-mcp-test --env-file /tmp/lichess-test.env \
#     -f docker-compose.yml -f docker-compose.test.yml up -d --build lichess-mcp
#   curl -s -H "Authorization: Bearer test-local" http://127.0.0.1:18000/web/api/version
services:
  lichess-mcp:
    ports:
      - "18000:8000"
  caddy:
    profiles: ["neverl Launch"]
